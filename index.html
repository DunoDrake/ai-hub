}

function boardColumn(status, tasks, index, data, sprintTitles) {
  const finished = FINISHED.test(status);
  const closed = /^closed$/i.test(status);
  const active = status.toLowerCase() === board.mobileStatus.toLowerCase();
  const col = el("section", { className: `bcol ${finished ? "fin" : ""} ${closed ? "closed" : ""} ${active ? "active" : ""}` });
  col.append(el("div", { className: "bhead" }, [el("span", { textContent: status }), el("span", { className: "n", textContent: String(tasks.length) })]));
  if (index === 0) col.append(quickAdd());
  col.ondragover = (event) => { if (!board.dragging) return; event.preventDefault(); col.classList.add("over"); };
  col.ondragleave = (event) => { if (!col.contains(event.relatedTarget)) col.classList.remove("over"); };
  col.ondrop = (event) => {
    event.preventDefault();
    col.classList.remove("over");
    moveTicket(event.dataTransfer.getData("text/plain"), status);
  };
  const limit = board.limits[status] || (finished ? FINISHED_PAGE : FIRST_PAGE);
  for (const task of tasks.slice(0, limit)) col.append(ticket(task, data.statuses, sprintTitles));
  if (!tasks.length) col.append(el("div", { className: "bempty", textContent: "No tickets here" }));
  if (tasks.length > limit) {
    const more = el("button", { className: "more", type: "button", textContent: `Show ${Math.min(FIRST_PAGE, tasks.length - limit)} more · ${tasks.length - limit} hidden` });
    more.onclick = () => { board.limits[status] = limit + FIRST_PAGE; renderBoard(); };
    col.append(more);
  }
  return col;
}

function closedPlaceholder() {
  const enable = el("button", { type: "button", textContent: "Enable Closed column" });
  enable.onclick = async () => {
    if (!confirm('Add "Closed" to statuses in this repo\'s backlog/config.yml? The file is edited in the repo.')) return;
    enable.disabled = true;
    try {
      await api("POST", `/api/projects/${board.id}/closed`);
      setMessage("Closed column enabled", true);
    } catch (error) {
      setMessage(error.message);
    }
    await loadBoardData();
  };
  return el("div", { className: "bcol ghost" }, [
    el("p", { textContent: "Closed is off for this project. Closed tickets count as finished in sprint progress." }),
    enable,
  ]);
}

function renderStatusTabs(columns, shown) {
  if (!board.mobileStatus || !columns.some((status) => status.toLowerCase() === board.mobileStatus.toLowerCase())) board.mobileStatus = columns[0] || "";
  statusTabs.replaceChildren(...columns.map((status) => {
    const count = shown.filter((task) => task.status.toLowerCase() === status.toLowerCase()).length;
    const button = el("button", { type: "button", className: status.toLowerCase() === board.mobileStatus.toLowerCase() ? "active" : "", textContent: `${status} ${count}` });
    button.onclick = () => { board.mobileStatus = status; renderBoard(); };
    return button;
  }));
}

function renderBoard() {
  const data = board.data;
  if (!data) return;
  syncToolbar();
  renderHealthBar();
  document.getElementById("boardTitle").textContent = data.project.name;
  const finishedCount = data.tasks.filter((task) => FINISHED.test(task.status)).length;
  document.getElementById("boardMeta").textContent = `${data.tasks.length} tickets, ${finishedCount} finished`;
  const scroll = boardEl.scrollLeft;
  const shown = visibleTasks();
  const sprintTitles = new Map(data.sprints.map((sprint) => [sprint.id, sprint.title]));
  const known = new Set(data.statuses.map((status) => status.toLowerCase()));
  const extra = [...new Set(shown.map((task) => task.status))].filter((status) => !known.has(status.toLowerCase()));
  const columns = [...data.statuses, ...extra];
  if (!data.closedEnabled) columns.push("Closed setup");
  renderStatusTabs(columns, shown);
  const rendered = data.statuses.concat(extra).map((status, index) => boardColumn(status, shown.filter((task) => task.status.toLowerCase() === status.toLowerCase()), index, data, sprintTitles));
  if (!data.closedEnabled) {
    const ghost = closedPlaceholder();
    if (board.mobileStatus === "Closed setup") ghost.classList.add("active");
    rendered.push(ghost);
  }
  boardEl.replaceChildren(...rendered);
  boardEl.scrollLeft = scroll;
  if (data.sprintsError) setMessage(data.sprintsError);
}

function phaseDurationText(duration) {
  if (!duration) return "—";
  const actual = `${duration.actualDays}d actual`;
  if (duration.estimatedDays === null) return `${actual}${duration.ongoing ? " (ongoing)" : ""}`;
  const verdict = duration.ongoing ? "" : duration.actualDays > duration.estimatedDays ? " (late)" : " (on time)";
  return `${actual} / ${duration.estimatedDays}d est${verdict}`;
}

function gateBadge(gate) {
  if (!gate) return el("span", { className: "gate none", textContent: "no gate" });
  const cls = gate.decision === "approved" ? "approved" : "rework";
  const title = `${gate.decision}${gate.reviewer ? ` by ${gate.reviewer}` : ""}${gate.date ? ` on ${gate.date.slice(0, 10)}` : ""}`;
  return el("span", { className: `gate ${cls}`, textContent: gate.decision, title });
}

function phaseRow(phase, activeId) {
  const pct = phase.percent === null ? 0 : phase.percent;
  return el("div", { className: `phase-row${phase.milestoneId === activeId ? " active" : ""}${phaseClass(phase.phase)}` }, [
    el("div", { className: "name", textContent: phase.phase, title: phase.phase }),
    el("div", { className: "bar" }, [el("span", { style: `width:${pct}%` })]),
    el("div", { className: "count", textContent: `${phase.done}/${phase.total}` }),
    el("div", { className: "duration", textContent: phaseDurationText(phase.duration), title: "actual / estimated phase duration" }),
    gateBadge(phase.gate),
  ]);
}

// Phase velocity (tickets done per phase) and gate decisions are shown per row; this builds the
// summary line (last-3-phase trend + overall gate pass rate) and the export links above the rows.
function renderPhaseMetrics() {
  const metrics = board.metrics;
  if (!metrics || !metrics.phases.length) {
    phaseMetricsEl.hidden = true;
    phaseMetricsEl.replaceChildren();
    return;
  }
  phaseMetricsEl.hidden = false;
  const exportBase = `/api/projects/${board.id}/metrics`;
  const head = el("div", { className: "phase-metrics-head" }, [
    el("h3", { textContent: "Phase metrics" }),
    el("div", { className: "exports" }, [
      el("a", { href: exportBase, download: "phase-metrics.json", textContent: "Export JSON" }),
      el("a", { href: `${exportBase}?format=csv`, download: "phase-metrics.csv", textContent: "Export CSV" }),
    ]),
  ]);
  const summary = [];
  if (metrics.trend.length) {
    const chips = [];
    metrics.trend.forEach((phase, index) => {
      if (index > 0) chips.push(el("span", { textContent: "→" }));
      chips.push(el("span", { className: "chip", textContent: `${phase.percent}%`, title: phase.phase }));
    });
    summary.push(el("div", { className: "phase-trend" }, [el("span", { textContent: "Last 3 phases:" }), ...chips]));
  }
  summary.push(el("div", {
    textContent: metrics.gatePassRate
      ? `Gate pass rate: ${metrics.gatePassRate.approved}/${metrics.gatePassRate.approved + metrics.gatePassRate.rework} approved (${metrics.gatePassRate.percent}%)`
      : "Gate pass rate: no gate decisions recorded yet",
  }));
  const activeId = (metrics.phases.find((phase) => !phase.completed && phase.total > 0) || {}).milestoneId || null;
  const rows = el("div", { className: "phase-rows" }, metrics.phases.map((phase) => phaseRow(phase, activeId)));
  phaseMetricsEl.replaceChildren(head, el("div", { className: "phase-metrics-summary" }, summary), rows);
}

async function loadBoardData() {
  const id = board.id;
  if (!id) return;
  try {
    const [data, metrics] = await Promise.all([
      api("GET", `/api/projects/${id}/board`),
      api("GET", `/api/projects/${id}/metrics`).catch(() => null),
    ]);
    if (board.id !== id) return;
    board.data = data;
    board.metrics = metrics;
    renderBoard();
    renderPhaseMetrics();
    renderRoadmap();
  } catch (error) {
    setMessage(error.message);
  }
}

function showView() {
  const match = /^#board\/([a-f0-9]{8})(?:\/([^/]+))?$/.exec(location.hash);
  const open = Boolean(match);
  board.id = open ? match[1] : null;
  board.pendingSprint = open && match[2] ? decodeURIComponent(match[2]) : null;
  boardView.hidden = !open;
  grid.hidden = open;
  addForm.hidden = open;
  modelRail.hidden = open;
  mainEl.classList.toggle("wide", open);
  setMessage("");
  if (open) {
    board.data = null;
    board.metrics = null;
    board.limits = {};
    board.mobileStatus = "";
    board.sprintSig = "";
    phaseMetricsEl.hidden = true;
    document.getElementById("roadmapViz").hidden = true;
    document.getElementById("phaseDetail").hidden = true;
    healthFilter.key = ""; healthFilter.ids = null;
    document.getElementById("healthBar").hidden = true;
    boardEl.replaceChildren();
    loadBoardData();
  } else {
    refresh();
  }
}

for (const control of [fSearch, fSprint, fState, fPriority, fTier]) control.addEventListener("input", () => { renderBoard(); renderRoadmap(); });
document.getElementById("boardBack").onclick = () => { location.hash = ""; };
window.addEventListener("hashchange", showView);

const themeBtn = document.getElementById("theme");
function applyTheme(theme) {
  document.documentElement.dataset.theme = theme;
  themeBtn.textContent = theme === "dark" ? "☀ Light" : "☾ Dark";
  document.querySelector('meta[name="theme-color"]').content = theme === "dark" ? "#050a14" : "#f8fafc";
  try { localStorage.setItem("ai-hub-theme", theme); } catch (error) { /* storage unavailable */ }
}
themeBtn.addEventListener("click", () => applyTheme(document.documentElement.dataset.theme === "dark" ? "light" : "dark"));
applyTheme(document.documentElement.dataset.theme);
renderModelRail();
showView();
setInterval(() => {
  if (document.hidden) return;
  const focused = document.activeElement;
  const editing = focused && /^(INPUT|SELECT)$/.test(focused.tagName) && (grid.contains(focused) || boardView.contains(focused));
  if (board.id) { if (!board.busy && !board.dragging && !editing) loadBoardData(); return; }
  if (!busy.size && !editing) refresh();
}, 5000);
function phaseTasks(milestoneId) {
  return board.data ? board.data.tasks.filter((task) => task.milestone === milestoneId) : [];
}

function focusTicket(taskId) {
  const find = () => boardEl.querySelector(`[data-id="${CSS.escape(taskId)}"]`);
  let node = find();
  if (!node) {
    fSprint.value = ""; fState.value = ""; fSearch.value = ""; fPriority.value = ""; fTier.value = "";
    healthFilter.key = ""; healthFilter.ids = null;
    renderBoard();
    renderRoadmap();
    node = find();
  }
  if (!node) return;
  node.scrollIntoView({ block: "center", behavior: "smooth" });
  node.classList.add("flash");
  setTimeout(() => node.classList.remove("flash"), 1600);
}

function clearPhaseFilter() {
  fSprint.value = "";
  renderBoard();
  renderRoadmap();
}

function renderPhaseDetail(phase, state) {
  const panel = document.getElementById("phaseDetail");
  if (!phase) { panel.hidden = true; panel.replaceChildren(); return; }
  const tasks = phaseTasks(phase.milestoneId);
  const statusOrder = board.data.statuses.map((status) => status.toLowerCase());
  const rank = (status) => (/progress/i.test(status) ? 0 : FINISHED.test(status) ? 3 : 1);
  const groups = new Map();
  for (const task of tasks) {
    if (!groups.has(task.status)) groups.set(task.status, []);
    groups.get(task.status).push(task);
  }
  const ordered = [...groups.keys()].sort((a, b) => rank(a) - rank(b) || statusOrder.indexOf(a.toLowerCase()) - statusOrder.indexOf(b.toLowerCase()));
  const pct = phase.percent || 0;
  const gate = phase.gate ? `gate ${phase.gate.decision}${phase.gate.reviewer ? ` by ${phase.gate.reviewer}` : ""}` : "no gate decision yet";
  const head = el("div", { className: "pd-head" }, [
    el("strong", { textContent: phase.phase }),
    el("span", { className: "rm-state", textContent: state }),
    el("span", { className: "pd-meta", textContent: `${phase.done}/${phase.total} done \u00b7 ${pct}% \u00b7 ${gate}` }),
    el("button", { className: "pd-clear", type: "button", textContent: "Show all phases", onclick: clearPhaseFilter }),
  ]);
  const row = (task) => el("button", { className: "pd-row", type: "button", title: task.title, onclick: () => focusTicket(task.id) }, [
    el("span", { className: "pd-id", textContent: task.id }),
    el("span", { className: "pd-title", textContent: task.title }),
    el("span", { className: "pd-model", textContent: task.modelTier && MODEL_INFO[task.modelTier] ? MODEL_INFO[task.modelTier].provider : "no model" }),
  ]);
  const sections = [];
  if (!ordered.some((status) => /progress/i.test(status))) {
    sections.push(el("div", { className: "pd-empty", textContent: "No ticket is in progress in this phase." }));
  }
  for (const status of ordered) {
    const list = groups.get(status);
    const grid = el("div", { className: "pd-list" }, list.map(row));
    if (FINISHED.test(status)) {
      const key = `${phase.milestoneId}:${status}`;
      const details = el("details", { className: "pd-group", open: board.openGroups.has(key) }, [el("summary", { textContent: `${status} \u00b7 ${list.length}` }), grid]);
      details.ontoggle = () => { if (details.open) board.openGroups.add(key); else board.openGroups.delete(key); };
      sections.push(details);
    } else {
      sections.push(el("div", { className: `pd-group${/progress/i.test(status) ? " progress" : ""}` }, [el("h4", { textContent: `${status} \u00b7 ${list.length}` }), grid]));
    }
  }
  panel.className = `phase-detail${phaseClass(phase.phase)}`;
  panel.replaceChildren(head, el("div", { className: "pd-bar" }, [el("span", { style: `width:${pct}%` })]), ...sections);
  panel.hidden = false;
}

function renderRoadmap() {
  const viz = document.getElementById("roadmapViz");
  const phases = ((board.metrics && board.metrics.phases) || []).filter((phase) => /^Phase\s*\d+/i.test(phase.phase));
  viz.hidden = !phases.length;
  if (!phases.length) { renderPhaseDetail(null); return; }
  const activeId = (phases.find((phase) => !phase.completed && phase.total > 0) || {}).milestoneId || null;
  const selectedId = fSprint.value;
  const nodes = [];
  let approved = 0;
  let selected = null;
  let selectedState = "";
  phases.forEach((phase, index) => {
    if (index) nodes.push(el("div", { className: "rm-link" }));
    const match = /^Phase\s*(\d+)\s*[-:\u2013]?\s*(.*)$/i.exec(phase.phase);
    const decision = phase.gate && phase.gate.decision;
    let cls = "";
    let state = "upcoming";
    if (decision === "approved") { cls = "approved"; state = "approved"; approved += 1; }
    else if (decision === "rework") { cls = "active"; state = "rework"; }
    else if (phase.completed) { cls = "done"; state = "ready for gate"; }
    else if (phase.milestoneId === activeId) { cls = "active"; state = "in progress"; }
    const isSelected = phase.milestoneId === selectedId;
    if (isSelected) { selected = phase; selectedState = state; }
    const node = el("button", {
      type: "button",
      className: `rm-node ${cls}${phaseClass(phase.phase)}${isSelected ? " selected" : ""}`,
      title: `${phase.phase} \u2014 click to ${isSelected ? "show all phases" : "filter tickets"}`,
      ariaPressed: String(isSelected),
    }, [
      el("div", { className: "rm-dot", textContent: match ? match[1] : "\u2022" }),
      el("div", { className: "rm-name", textContent: (match && match[2]) || phase.phase }),
      el("div", { className: "rm-bar" }, [el("span", { style: `width:${phase.percent || 0}%` })]),
      el("div", { className: "rm-count", textContent: `${phase.done}/${phase.total}` }),
      el("div", { className: "rm-state", textContent: state }),
    ]);
    node.onclick = () => { fSprint.value = isSelected ? "" : phase.milestoneId; renderBoard(); renderRoadmap(); };
    nodes.push(node);
  });
  document.getElementById("roadmapTimeline").replaceChildren(...nodes);
  document.getElementById("roadmapMeta").textContent = `${phases.length} phases \u00b7 ${approved} approved \u00b7 click a phase to filter`;
  renderPhaseDetail(selected, selectedState);
}
</script>
</body>
</html>
