<link rel="preconnect" href="https://fonts.googleapis.com">

<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg:#f8fafc; --grid:#e2e8f0; --text:#0f172a; --muted:#64748b; --dim:#64748b; --panel:#ffffff;
  --pb:#e2e8f0; --arrow:#94a3b8; --row:#f1f5f9; --ok:#059669; --run:#0891b2; --err:#e11d48;
  --accent:#4d7c0f; --accent-text:#ffffff; --warn:#d97706; --claude:#d97757; --gpt:#059669;
  --gemini:#7c3aed; --deepseek:#0891b2; --fg:var(--text); --line:var(--pb); --line-strong:var(--arrow);
  --surface:var(--row); --accent-ink:var(--accent-text); --r:3px; --r-lg:3px; color-scheme:light;
}
[data-theme="dark"] {
  --bg:#050a14; --grid:#12203a; --text:#e6efe0; --muted:#8a9aa6; --dim:#7a8a96; --panel:rgba(10,18,32,.72);
  --pb:rgba(190,255,120,.16); --arrow:#4b5b6b; --row:rgba(190,255,120,.045); --ok:#b6ff6a;
  --run:#7dd3fc; --err:#fb7185; --accent:#b6ff6a; --accent-text:#0a1400; --warn:#fbbf24;
  --claude:#fb8f67; --gpt:#34d399; --gemini:#a78bfa; --deepseek:#22d3ee;
  --fg:var(--text); --line:var(--pb); --line-strong:var(--arrow); --surface:var(--row); --accent-ink:var(--accent-text); color-scheme:dark;
}
* { box-sizing:border-box; }
[hidden] { display:none !important; }
html { font-size:16px; -webkit-font-smoothing:antialiased; }
body { margin:0; min-height:100vh; color:var(--text); background-color:var(--bg); font:13px/1.45 "JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,"DejaVu Sans Mono",monospace;
  background-image:linear-gradient(color-mix(in srgb,var(--grid) 55%,transparent) 1px,transparent 1px),linear-gradient(90deg,color-mix(in srgb,var(--grid) 55%,transparent) 1px,transparent 1px); background-size:32px 32px; background-position:-1px -1px; background-attachment:fixed; }
[data-theme="dark"] body { background-image:radial-gradient(1200px 600px at 78% -10%,rgba(40,80,190,.38),transparent 60%),radial-gradient(800px 500px at 10% 110%,rgba(20,50,130,.35),transparent 60%),linear-gradient(color-mix(in srgb,var(--grid) 30%,transparent) 1px,transparent 1px),linear-gradient(90deg,color-mix(in srgb,var(--grid) 30%,transparent) 1px,transparent 1px); background-size:auto,auto,32px 32px,32px 32px; background-repeat:no-repeat,no-repeat,repeat,repeat; }
button, input, select { font:inherit; }
button, input, select, a { -webkit-tap-highlight-color:transparent; }
button, input, select { color:var(--text); background:var(--panel); border:1px solid var(--pb); border-radius:3px; padding:6px 9px; }
button { cursor:pointer; font-size:10.5px; font-weight:500; text-transform:uppercase; letter-spacing:.07em; }

input:focus-visible, select:focus-visible, button:focus-visible, a:focus-visible, summary:focus-visible { outline:2px solid var(--run); outline-offset:2px; }

header { min-height:48px; display:grid; grid-template-columns:minmax(0,1fr) auto; align-items:center; gap:16px; padding:8px max(16px, calc((100vw - 1560px)/2)); background:transparent; }
.brandmark { width:18px; height:18px; display:grid; place-items:center; border:0; color:var(--accent); border-radius:0; font-size:0; }
.brandmark::before { content:"✦"; font-size:17px; }
.brandcopy { display:flex; flex-direction:row; align-items:center; gap:12px; min-width:0; }
header h1 { margin:0; font-size:15px; line-height:1.15; letter-spacing:-.01em; white-space:nowrap; }
header .sub { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.theme-btn { justify-self:end; border:1px solid var(--pb); background:var(--panel); border-radius:3px; padding:5px 10px; }
.sub { color:var(--muted); font-size:11px; }
main { max-width:1560px; margin:0 auto; padding:8px 16px 48px; }
main.wide { max-width:1920px; }

.add { display:flex; align-items:center; justify-content:space-between; gap:12px; padding:6px 6px 6px 12px; margin-bottom:10px; background:var(--panel); border:1px solid var(--pb); border-left:2px solid var(--accent); border-radius:3px; backdrop-filter:blur(12px); }
.add .hint { color:var(--muted); font-size:11px; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.add button { flex:0 0 auto; }
dialog.picker { width:min(640px, calc(100vw - 24px)); max-height:min(640px, calc(100vh - 24px)); padding:0; color:var(--text); background:var(--bg); border:1px solid var(--arrow); border-left:2px solid var(--accent); border-radius:4px; box-shadow:0 24px 80px rgba(0,0,0,.55); }
dialog.picker[open] { display:flex; flex-direction:column; }
dialog.picker::backdrop { background:rgba(2,6,16,.62); backdrop-filter:blur(3px); }
.pk-head { display:flex; align-items:center; justify-content:space-between; gap:10px; padding:10px 12px; border-bottom:1px solid var(--pb); }
.pk-head h2 { margin:0; font-size:12px; text-transform:uppercase; letter-spacing:.07em; }
.pk-bar { display:flex; gap:6px; padding:8px 12px; border-bottom:1px solid var(--pb); }
.pk-bar input { flex:1; min-width:0; }
.pk-bar button { flex:0 0 auto; }
.pk-crumbs { display:flex; flex-wrap:wrap; align-items:center; gap:2px; padding:6px 12px; font-size:11px; color:var(--muted); border-bottom:1px solid var(--pb); }
.pk-crumbs button { border:0; background:transparent; padding:1px 4px; text-transform:none; letter-spacing:normal; font-size:11px; color:var(--run); }
.pk-list { flex:1; min-height:180px; overflow-y:auto; padding:4px 6px; display:flex; flex-direction:column; gap:1px; }
.pk-row { display:flex; align-items:center; gap:8px; width:100%; text-align:left; border:0; border-radius:3px; background:transparent; padding:6px 8px; text-transform:none; letter-spacing:normal; font-size:12.5px; font-weight:500; }
.pk-row:hover, .pk-row:focus-visible { background:var(--row); }
.pk-row.selected { background:color-mix(in srgb, var(--accent) 16%, transparent); outline:1px solid var(--accent); }
.pk-row .pk-name { flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.pk-row .pk-tag { font-size:9.5px; padding:0 6px; border:1px solid var(--pb); border-radius:999px; color:var(--muted); text-transform:uppercase; letter-spacing:.05em; white-space:nowrap; }
.pk-row .pk-tag.git { color:var(--run); border-color:var(--run); }
.pk-row .pk-tag.bl { color:var(--ok); border-color:var(--ok); }
.pk-row .pk-tag.added { color:var(--muted); }
.pk-row.disabled { opacity:.5; }
.pk-empty { padding:24px 12px; text-align:center; color:var(--muted); font-size:12px; }
.pk-foot { display:grid; grid-template-columns:1fr auto; gap:8px 10px; align-items:center; padding:10px 12px; border-top:1px solid var(--pb); }
.pk-foot .pk-sel { min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-size:11.5px; color:var(--muted); }
.pk-foot .pk-sel b { color:var(--text); font-weight:600; }
.pk-foot input { grid-column:1; min-width:0; }
.pk-foot .pk-actions { grid-column:2; grid-row:1 / span 2; display:flex; gap:6px; align-self:end; }
.pk-err { grid-column:1 / -1; min-height:0; font-size:11px; color:var(--err); }
.pk-err:empty { display:none; }
.model-rail { display:flex; flex-wrap:wrap; gap:0; margin:0 0 10px; background:var(--panel); border:1px solid var(--pb); border-left:2px solid var(--accent); border-radius:3px; backdrop-filter:blur(12px); }
.provider-badge { min-width:0; display:inline-flex; align-items:center; gap:7px; padding:6px 10px; border:0; border-left:1px solid var(--pb); border-radius:0; color:var(--text); background:transparent; font-size:10px; line-height:1; white-space:nowrap; text-transform:uppercase; letter-spacing:.06em; }
.provider-badge:first-child { border-left:0; }
.provider-badge .provider { font-weight:600; }
.provider-badge .level { color:var(--muted); }
.marks { display:inline-flex; align-items:center; gap:5px; }
.provider-icon { display:inline-grid; min-width:14px; height:14px; place-items:center; font-size:9px; font-weight:700; letter-spacing:0; text-transform:none; }
.provider-badge.claude { color:var(--claude); }
.provider-badge.gpt { color:var(--gpt); }
.provider-badge.deepseek { color:var(--deepseek); }
.provider-badge.art { color:var(--gemini); }
.provider-badge.art .provider-icon.openai { color:var(--gpt); }
.provider-badge.missing { color:var(--warn); }
.provider-badge.missing .mark { display:inline-grid; width:14px; height:14px; place-items:center; background:var(--warn); color:#2a1b00; font-weight:700; }
@supports ((mask-image:url("")) or (-webkit-mask-image:url(""))) {
  .provider-icon { width:14px; min-width:14px; background:currentColor; font-size:0; mask:center/contain no-repeat; -webkit-mask:center/contain no-repeat; }
  .provider-icon.claude { mask-image:url("/assets/providers/claude.svg"); -webkit-mask-image:url("/assets/providers/claude.svg"); }
  .provider-icon.openai { mask-image:url("/assets/providers/openai.svg"); -webkit-mask-image:url("/assets/providers/openai.svg"); }
  .provider-icon.gemini { mask-image:url("/assets/providers/gemini.svg"); -webkit-mask-image:url("/assets/providers/gemini.svg"); }
  .provider-icon.deepseek { mask-image:url("/assets/providers/deepseek.svg"); -webkit-mask-image:url("/assets/providers/deepseek.svg"); }
}

.msg { min-height:18px; margin:0 0 6px; font-size:11px; color:var(--err); }
.msg.ok { color:var(--ok); }
.grid { display:flex; flex-direction:column; gap:10px; }
.card { background:var(--panel); border:1px solid var(--pb); border-left:2px solid var(--accent); border-radius:3px; overflow:hidden; backdrop-filter:blur(12px); }
.card.missing { border-left-color:var(--err); }
.card-main { min-height:76px; display:grid; grid-template-columns:minmax(220px,280px) minmax(220px,1fr) auto; align-items:center; gap:18px; padding:10px 12px; }
.identity { min-width:0; }
.identity-row { display:flex; align-items:center; gap:8px; margin-bottom:2px; }
.title { min-width:0; font-weight:700; font-size:13px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.path { color:var(--dim); font-size:10px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.badge { font-size:9.5px; padding:1px 6px; border-radius:999px; border:1px solid var(--pb); color:var(--muted); white-space:nowrap; text-transform:uppercase; letter-spacing:.05em; }
.badge.on { color:var(--ok); border-color:var(--ok); }
.badge.bad { color:var(--err); border-color:var(--err); }
.badge.gate-not-started { color:var(--muted); }
.badge.gate-in-progress { color:var(--run); border-color:var(--run); }
.badge.gate-completed { color:var(--ok); border-color:var(--ok); }
.badge.gate-approved { color:var(--accent-text); border-color:var(--accent); background:var(--accent); }
.activity { min-width:0; display:flex; flex-direction:column; gap:5px; }
.phase { min-width:0; display:flex; flex-direction:column; gap:3px; }
.phase-head { display:flex; align-items:center; justify-content:space-between; gap:6px; }
.phase-name { min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-size:10.5px; font-weight:600; color:var(--text); }
.phase-bar { height:4px; border-radius:999px; background:var(--pb); overflow:hidden; }
.phase-fill { height:100%; background:var(--run); border-radius:999px; }
button.phase-open { border-color:var(--accent); color:var(--accent); }
.cols { display:flex; flex-wrap:wrap; gap:0; }
.col { display:inline-flex; align-items:baseline; gap:4px; color:var(--muted); background:transparent; border:0; border-left:1px solid var(--pb); border-radius:0; padding:2px 10px; font-size:10px; text-transform:uppercase; letter-spacing:.05em; }
.col:first-child { border-left:0; padding-left:0; }
.col b { color:var(--text); font-size:14px; font-variant-numeric:tabular-nums; }
.col.prog b { color:var(--run); } .col.done b { color:var(--ok); }
.now { min-width:0; color:var(--muted); font-size:10.5px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.now strong { color:var(--text); }
.hchips { display:flex; flex-wrap:wrap; gap:4px; }
.hchip { display:inline-flex; align-items:center; gap:5px; padding:1px 7px; border:1px solid var(--pb); border-radius:999px; font-size:10px; color:var(--muted); background:transparent; text-transform:none; letter-spacing:normal; font-weight:500; white-space:nowrap; }
.hchip b { font-weight:700; color:var(--text); }
.hchip.bad { color:var(--err); border-color:var(--err); }
.hchip.bad b { color:var(--err); }
.hchip.warn { color:var(--warn); border-color:var(--warn); }
.hchip.warn b { color:var(--warn); }
.hchip.ok { color:var(--ok); border-color:color-mix(in srgb, var(--ok) 55%, transparent); }
button.hchip { cursor:pointer; }
button.hchip:hover { border-color:var(--arrow); }
button.hchip.active { outline:2px solid var(--run); outline-offset:1px; }
.health-bar { display:flex; flex-wrap:wrap; align-items:center; gap:6px 10px; margin:0 0 10px; padding:6px 12px; background:var(--panel); border:1px solid var(--pb); border-left:2px solid var(--accent); border-radius:3px; backdrop-filter:blur(12px); }
.health-bar .hb-title { font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.07em; color:var(--muted); }
.health-bar .hb-clear { margin-left:auto; font-size:10px; padding:2px 8px; }
.ticket.stale { box-shadow:inset 0 0 0 1px var(--warn); }
.ticket.blocked { opacity:.72; }
.tmeta .flag { font-weight:600; }
.tmeta .flag.stale { color:var(--warn); border-color:var(--warn); }
.tmeta .flag.blocked { color:var(--err); border-color:var(--err); }
.tmeta .flag.ready { color:var(--ok); border-color:var(--ok); }
.actions { display:flex; flex-wrap:wrap; justify-content:flex-end; gap:6px; align-items:center; }
.actions a.open { text-decoration:none; color:var(--accent-text); background:var(--accent); border:1px solid var(--accent); border-radius:3px; padding:6px 9px; font-size:10.5px; font-weight:700; text-transform:uppercase; letter-spacing:.07em; }
button.board-open { border-color:var(--run); color:var(--run); }
.init { display:flex; gap:6px; align-items:center; }
.init input { width:112px; }

.card-detail { display:flex; flex-wrap:wrap; border-top:1px solid var(--pb); background:var(--row); }
.drawer { flex:1 1 280px; border-right:1px solid var(--pb); }
.drawer:last-child { border-right:0; }
.drawer summary { list-style:none; cursor:pointer; padding:7px 12px; color:var(--muted); font-size:10px; text-transform:uppercase; letter-spacing:.08em; user-select:none; }
.drawer summary::-webkit-details-marker { display:none; }
.drawer summary::before { content:""; display:inline-block; width:2px; height:10px; margin-right:8px; vertical-align:-1px; background:var(--accent); }
.drawer[open] summary::before { content:""; }
.drawer-body { display:flex; flex-direction:column; gap:6px; padding:0 16px 12px; }
.sprint { display:grid; grid-template-columns:minmax(0,1fr) auto; gap:10px; padding:5px 0; border-bottom:1px solid var(--line); font-size:12px; }
.sprint.completed { opacity:.55; }
.sprint span:first-child { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.sprint span:last-child { color:var(--muted); white-space:nowrap; }
.sprintform { display:grid; grid-template-columns:minmax(120px,1fr) 138px auto; gap:6px; margin-top:5px; }
.sprintform input, .sprintform button { padding:6px 8px; font-size:12px; }
.utask { display:grid; grid-template-columns:minmax(0,1fr) minmax(130px,42%); gap:8px; align-items:center; font-size:12px; }
.utask span { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.utask select { min-width:0; font-size:11px; padding:5px 7px; }
.notice { margin:0 16px 12px; font-size:12px; color:var(--warn); display:flex; justify-content:space-between; gap:8px; align-items:center; border:1px solid color-mix(in srgb, var(--warn), transparent 45%); border-radius:var(--r); padding:7px 9px; }
.err { color:var(--err); font-size:12px; overflow-wrap:anywhere; }
.empty { color:var(--muted); text-align:center; padding:64px 20px; border:1px dashed var(--line); border-radius:var(--r-lg); }

.btop { display:grid; grid-template-columns:auto minmax(0,1fr) auto; align-items:center; gap:12px; margin-bottom:10px; min-height:40px; }
.btop h2 { margin:0; font-size:13px; font-weight:600; overflow-wrap:anywhere; }
#boardBack { color:var(--run); background:var(--panel); }
.phase-metrics { border:1px solid var(--pb); border-left:2px solid var(--accent); border-radius:3px; background:var(--panel); backdrop-filter:blur(12px); padding:10px 12px; margin-bottom:10px; display:flex; flex-direction:column; gap:8px; }
.phase-metrics-head { display:flex; align-items:baseline; justify-content:space-between; gap:10px; flex-wrap:wrap; }
.phase-metrics-head h3 { margin:0; font-size:11.5px; font-weight:700; text-transform:uppercase; letter-spacing:.07em; color:var(--muted); }
.phase-metrics-head .exports { display:flex; gap:10px; }
.phase-metrics-head .exports a { font-size:11px; color:var(--run); text-decoration:none; }
.phase-metrics-head .exports a:hover { text-decoration:underline; }
.phase-metrics-empty { color:var(--muted); font-size:12px; }
.phase-metrics-summary { display:flex; gap:14px; flex-wrap:wrap; font-size:11.5px; color:var(--muted); }
.phase-metrics-summary b { color:var(--text); font-weight:600; }
.phase-trend { display:flex; align-items:center; gap:5px; }
.phase-trend .chip { padding:1px 6px; border-radius:2px; background:var(--row); font-weight:600; color:var(--text); }
.phase-rows { display:flex; flex-direction:column; gap:5px; }
.phase-row { display:grid; grid-template-columns:minmax(120px,1.2fr) minmax(70px,1fr) 56px minmax(150px,auto) 84px; gap:10px; align-items:center; font-size:11.5px; }
.phase-row .name { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.phase-row .bar { height:6px; border-radius:3px; background:var(--row); overflow:hidden; }
.phase-row .bar span { display:block; height:100%; background:var(--accent); }
.phase-row.active .bar span { background:var(--run); }
.phase-row .count { color:var(--muted); white-space:nowrap; }
.phase-row .duration { color:var(--muted); white-space:nowrap; font-size:11px; }
.phase-row .gate { justify-self:start; padding:1px 6px; border-radius:2px; font-size:10.5px; font-weight:700; text-transform:uppercase; letter-spacing:.04em; white-space:nowrap; }
.phase-row .gate.approved { color:var(--ok); background:color-mix(in srgb, var(--ok) 16%, transparent); }
.phase-row .gate.rework { color:var(--err); background:color-mix(in srgb, var(--err) 16%, transparent); }
.phase-row .gate.none { color:var(--muted); background:var(--row); }
@media (max-width:640px) {
  .phase-row { grid-template-columns:minmax(0,1fr) auto; grid-template-areas:"name gate" "bar bar" "count duration"; row-gap:3px; }
  .phase-row > * { min-width:0; }
  .phase-row .name { grid-area:name; }
  .phase-row .gate { grid-area:gate; justify-self:end; }
  .phase-row .bar { grid-area:bar; }
  .phase-row .count { grid-area:count; }
  .phase-row .duration { grid-area:duration; text-align:right; white-space:normal; }
  .phase-rows { gap:12px; }
}
.btools { position:sticky; top:0; z-index:5; display:grid; grid-template-columns:minmax(220px,1fr) repeat(4,minmax(130px,auto)); gap:0; margin:0 0 10px; padding:0; background:var(--panel); border:1px solid var(--pb); border-left:2px solid var(--accent); border-radius:3px; backdrop-filter:blur(12px); }
.btools input, .btools select { min-width:0; background:transparent; border:0; border-left:1px solid var(--pb); border-radius:0; }
.btools input { border-left:0; }
.status-tabs { display:none; }
.board { display:grid; grid-template-columns:repeat(4,minmax(220px,1fr)); gap:10px; align-items:start; padding-bottom:12px; }
.bcol { min-width:0; background:var(--panel); border:1px solid var(--pb); border-left:2px solid var(--accent); border-radius:3px; padding:0 8px 8px; display:flex; flex-direction:column; gap:7px; min-height:170px; backdrop-filter:blur(12px); }
.bcol.over { border-color:var(--run); border-left-color:var(--run); background:color-mix(in srgb,var(--run) 12%,var(--panel)); }
.bcol.ghost { background:var(--panel); border-style:dashed; color:var(--muted); font-size:11px; padding-top:8px; }
.bcol.ghost p { margin:2px 0; }
.bhead { display:flex; align-items:center; justify-content:space-between; gap:8px; margin:0 -8px; padding:8px 10px; border-bottom:1px solid var(--pb); font-weight:500; font-size:10.5px; color:var(--muted); text-transform:uppercase; letter-spacing:.08em; }
.bhead span:first-child::before { content:""; display:inline-block; width:2px; height:10px; margin-right:8px; vertical-align:-1px; background:var(--accent); }
.bhead .n { min-width:24px; text-align:right; font-weight:500; font-size:10px; color:var(--dim); background:transparent; border:0; border-radius:0; padding:0; }
.bcol.fin .bhead { color:var(--ok); }
.bcol.closed .bhead { color:var(--muted); }
.ticket { position:relative; background:var(--row); border:1px solid var(--pb); border-left:2px solid transparent; border-radius:3px; padding:8px; display:flex; flex-direction:column; gap:6px; cursor:grab; }
.ticket:hover, .ticket:focus-within { border-color:var(--arrow); }
.ticket.dragging { opacity:.4; }
.ticket.p-high { border-left-color:var(--err); } .ticket.p-medium { border-left-color:var(--warn); } .ticket.p-low { border-left-color:var(--run); }
.ticket.ph { border-left:3px solid var(--pc); background:color-mix(in srgb, var(--pc) 8%, var(--row)); }
.ticket:not(.ph) { border-left:3px dashed var(--pb); }
.ticket.ph .tid { color:var(--pc); }
.ticket.flash { outline:2px solid var(--pc, var(--run)); outline-offset:2px; }
.tmeta .pri { font-weight:600; }
.tmeta .pri-high { color:var(--err); border-color:var(--err); }
.tmeta .pri-medium { color:var(--warn); border-color:var(--warn); }
.tmeta .pri-low { color:var(--run); border-color:var(--run); }
button.rm-node { background:transparent; border:1px solid transparent; border-radius:4px; padding:6px 4px; text-transform:none; letter-spacing:normal; font-size:inherit; font-weight:inherit; cursor:pointer; color:var(--text); }
button.rm-node:hover:not(:disabled) { border-color:color-mix(in srgb, var(--pc, var(--arrow)) 60%, transparent); }
button.rm-node.selected { border-color:var(--pc); background:color-mix(in srgb, var(--pc) 12%, transparent); }
.phase-detail { margin-top:6px; padding:10px 12px; border:1px solid color-mix(in srgb, var(--pc) 45%, var(--pb)); border-left:3px solid var(--pc); border-radius:3px; background:color-mix(in srgb, var(--pc) 6%, transparent); display:flex; flex-direction:column; gap:8px; }
.pd-head { display:flex; flex-wrap:wrap; align-items:center; gap:10px; }
.pd-head strong { color:var(--pc); font-size:12.5px; }
.pd-head .pd-clear { margin-left:auto; }
.pd-meta { color:var(--muted); font-size:11px; }
.pd-bar { height:4px; border-radius:999px; background:var(--pb); overflow:hidden; }
.pd-bar span { display:block; height:100%; background:var(--pc); }
.pd-group h4 { margin:0 0 4px; font-size:10.5px; text-transform:uppercase; letter-spacing:.06em; color:var(--muted); }
.pd-group.progress h4 { color:var(--run); }
.pd-group summary { cursor:pointer; font-size:10.5px; text-transform:uppercase; letter-spacing:.06em; color:var(--muted); margin-bottom:4px; }
.pd-list { display:grid; grid-template-columns:repeat(auto-fill,minmax(260px,1fr)); gap:4px; }
button.pd-row { display:flex; align-items:center; gap:8px; min-width:0; text-align:left; text-transform:none; letter-spacing:normal; font-size:11.5px; font-weight:500; padding:4px 8px; background:var(--row); border-left:3px solid var(--pc); }
button.pd-row .pd-id { color:var(--pc); font-weight:700; font-size:10.5px; white-space:nowrap; }
button.pd-row .pd-title { flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
button.pd-row .pd-model { color:var(--muted); font-size:9.5px; white-space:nowrap; }
.pd-empty { color:var(--muted); font-size:11.5px; }
.bcol.closed .ticket, .bcol.fin .ticket { opacity:.78; }
.ticket-head { display:flex; justify-content:space-between; align-items:center; gap:8px; }
.tid { color:var(--dim); font-size:10px; font-weight:600; letter-spacing:.06em; }
.tt { min-height:35px; font-size:12px; line-height:1.4; font-weight:600; overflow-wrap:anywhere; display:-webkit-box; -webkit-line-clamp:3; -webkit-box-orient:vertical; overflow:hidden; }
.tmeta { display:flex; flex-wrap:wrap; gap:4px; font-size:9.5px; }
.tmeta span { border:1px solid var(--pb); border-radius:999px; padding:1px 6px; color:var(--muted); max-width:100%; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.tmeta .due.late { color:var(--err); border-color:var(--err); }
.ticket-actions { display:grid; grid-template-columns:1fr 1fr; gap:5px; }
.ticket-actions select { min-width:0; font-size:10px; padding:4px 5px; color:var(--muted); background:var(--panel); }
.quick { display:grid; grid-template-columns:minmax(0,1fr) auto; gap:5px; padding-top:1px; }
.quick input { min-width:0; grid-column:1/-1; font-size:11px; padding:5px 7px; }
.quick select { min-width:0; font-size:9.5px; padding:4px 5px; }
.quick button { padding:4px 8px; }
.more { font-size:10px; color:var(--muted); background:transparent; border-style:dashed; }
.bempty { color:var(--muted); font-size:10.5px; text-align:center; padding:24px 0; }

@media (max-width:900px) {
  .card-main { grid-template-columns:minmax(180px,240px) 1fr; }
  .actions { grid-column:1/-1; justify-content:flex-start; }
  .btools { grid-template-columns:1fr 1fr; }
  .board { grid-template-columns:repeat(4,minmax(250px,1fr)); overflow-x:auto; }
}
@media (max-width:640px) {
  header { padding:8px 14px; min-height:46px; }
  .brandmark { width:18px; height:18px; }
  .brandcopy { gap:8px; }
  header .sub { max-width:180px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .theme-btn { padding:4px 7px; }
  main, main.wide { padding:6px 10px 40px; }
  .add .hint { display:none; }
  .pk-foot { grid-template-columns:1fr; }
  .pk-foot .pk-actions { grid-column:1; grid-row:auto; justify-content:flex-end; }
  .pk-bar { flex-wrap:wrap; }
  .model-rail { flex-wrap:nowrap; overflow-x:auto; padding-bottom:0; }
  .provider-badge { flex:0 0 auto; }
  .card-main { grid-template-columns:1fr; gap:10px; }
  .identity-row { justify-content:space-between; }
  .activity { order:2; }
  .actions { order:3; }
  .actions button, .actions a.open { flex:1 1 auto; text-align:center; }
  .card-detail { display:block; }
  .drawer { border-right:0; border-bottom:1px solid var(--pb); }
  .drawer:last-child { border-bottom:0; }
  .sprintform { grid-template-columns:1fr 1fr; }
  .sprintform button { grid-column:1/-1; }
  .btop { grid-template-columns:auto minmax(0,1fr); align-items:center; }
  .btop h2 { font-size:13px; }
  .btools { position:static; grid-template-columns:1fr 1fr; margin:0 0 8px; }
  .btools input { grid-column:1/-1; border-bottom:1px solid var(--pb); }
  .status-tabs { display:flex; gap:0; overflow-x:auto; margin:0 0 8px; padding:0; border:1px solid var(--pb); border-left:2px solid var(--accent); background:var(--panel); }
  .status-tabs button { flex:0 0 auto; color:var(--muted); background:transparent; border:0; border-left:1px solid var(--pb); border-radius:0; padding:6px 10px; }
  .status-tabs button:first-child { border-left:0; }
  .status-tabs button.active { color:var(--accent-text); background:var(--accent); }
  .board { display:block; overflow:visible; }
  .bcol { display:none; }
  .bcol.active { display:flex; }
  .ticket-actions select { font-size:11px; opacity:1; }
}
@media (prefers-reduced-motion:reduce) { *, *::before, *::after { scroll-behavior:auto !important; transition:none !important; } }

/* Roadmap: one node per real milestone/phase of the project */
.roadmap-viz { border:1px solid var(--pb); border-left:2px solid var(--accent); border-radius:3px; background:var(--panel); backdrop-filter:blur(12px); padding:10px 12px; margin-bottom:10px; }
.roadmap-header { display:flex; align-items:baseline; justify-content:space-between; gap:10px; margin-bottom:10px; }
.roadmap-header h3 { margin:0; font-size:11.5px; font-weight:700; text-transform:uppercase; letter-spacing:.07em; color:var(--muted); }
.roadmap-legend { font-size:11px; color:var(--muted); }
.roadmap-timeline { display:flex; align-items:flex-start; gap:4px; overflow-x:auto; padding:2px 0 8px; }
.rm-node { flex:0 0 150px; min-width:0; display:flex; flex-direction:column; align-items:center; gap:5px; text-align:center; }
.rm-dot { width:30px; height:30px; border-radius:50%; border:2px solid var(--pb); background:var(--row); display:grid; place-items:center; font-weight:700; font-size:12px; }
.rm-node.done .rm-dot { border-color:var(--ok); color:var(--ok); }
.rm-node.active .rm-dot { border-color:var(--run); color:var(--run); }
.rm-node.approved .rm-dot { border-color:var(--accent); background:var(--accent); color:var(--accent-text); }
.rm-name { max-width:100%; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-size:11px; font-weight:600; }
.rm-bar { width:100%; height:3px; border-radius:999px; background:var(--pb); overflow:hidden; }
.rm-bar span { display:block; height:100%; background:var(--accent); }
.rm-node.active .rm-bar span { background:var(--run); }
.rm-count { font-size:10px; color:var(--muted); }
.rm-state { font-size:9.5px; text-transform:uppercase; letter-spacing:.05em; padding:1px 6px; border:1px solid var(--pb); border-radius:3px; color:var(--muted); white-space:nowrap; }
.rm-node.active .rm-state { color:var(--run); border-color:var(--run); }
.rm-node.done .rm-state { color:var(--ok); border-color:var(--ok); }
.rm-node.approved .rm-state { color:var(--accent-text); background:var(--accent); border-color:var(--accent); }
.rm-link { flex:0 0 12px; height:2px; margin-top:15px; background:var(--pb); }
/* Phase colors: hue picked from the phase number so the chip, roadmap node and metrics row agree */
.ph { --pc:hsl(var(--phue) 70% 36%); }
[data-theme="dark"] .ph { --pc:hsl(var(--phue) 85% 68%); }
.ph-0 { --phue:145; } .ph-1 { --phue:192; } .ph-2 { --phue:228; } .ph-3 { --phue:280; }
.ph-4 { --phue:325; } .ph-5 { --phue:12; } .ph-6 { --phue:38; } .ph-7 { --phue:75; }
.tmeta .ph { color:var(--pc); border-color:color-mix(in srgb, var(--pc) 55%, transparent); background:color-mix(in srgb, var(--pc) 13%, transparent); font-weight:600; }
.rm-node.ph .rm-dot { border-color:var(--pc); color:var(--pc); }
.rm-node.approved.ph .rm-dot { background:var(--pc); color:var(--accent-text); }
.rm-node.ph .rm-bar span { background:var(--pc); }
.rm-node.ph .rm-name { color:var(--pc); }
.phase-row.ph .name { border-left:3px solid var(--pc); padding-left:7px; }
.phase-row.ph .bar span { background:var(--pc); }
.phase-row.active .name { font-weight:700; }
</style>
</head>
<body>
<header>
  <div class="brandcopy">
    <div class="brandmark" aria-hidden="true">AI</div>
    <h1>AI Hub</h1>
    <span class="sub">Local work router for Backlog.md projects</span>
  </div>
  <button class="theme-btn" id="theme" type="button" aria-label="Toggle light or dark theme"></button>
</header>
<main id="main">
  <div class="add" id="addForm">
    <span class="hint">Pick a repository folder to manage with Backlog.md</span>
    <button class="primary" id="addOpen" type="button">Add project</button>
  </div>
  <dialog class="picker" id="picker" aria-labelledby="pkTitle">
    <div class="pk-head">
      <h2 id="pkTitle">Add project · choose a folder</h2>
      <button type="button" id="pkClose" aria-label="Close">✕</button>
    </div>
    <div class="pk-bar">
      <button type="button" id="pkUp" title="Parent folder">↑ Up</button>
      <button type="button" id="pkHome" title="Home folder">⌂ Home</button>
      <input id="pkPath" aria-label="Folder path" placeholder="Type or paste a path, press Enter" spellcheck="false" autocomplete="off">
    </div>
    <div class="pk-crumbs" id="pkCrumbs"></div>
    <div class="pk-list" id="pkList" role="listbox" aria-label="Folders"></div>
    <form class="pk-foot" id="pkForm">
      <div class="pk-sel" id="pkSel"></div>
      <input id="pkName" aria-label="Project name" placeholder="Display name (optional)" maxlength="80" autocomplete="off">
      <div class="pk-actions">
        <button type="button" id="pkCancel">Cancel</button>
        <button class="primary" type="submit" id="pkAdd">Add this folder</button>
      </div>
      <div class="pk-err" id="pkErr" role="alert"></div>
    </form>
  </dialog>
  <div class="model-rail" id="modelRail" aria-label="Model routing legend"></div>
  <div class="msg" id="msg" role="status" aria-live="polite"></div>
  <div class="grid" id="grid"></div>
  <div id="boardView" hidden>
    <div class="btop">
      <button id="boardBack" type="button">← Projects</button>
      <div>
        <h2 id="boardTitle"></h2>
        <span class="sub" id="boardMeta"></span>
      </div>
    </div>
    <div class="phase-metrics" id="phaseMetrics" hidden></div>

    <div class="roadmap-viz" id="roadmapViz" hidden>
      <div class="roadmap-header">
        <h3>Project roadmap</h3>
        <span class="roadmap-legend" id="roadmapMeta"></span>
      </div>
      <div class="roadmap-timeline" id="roadmapTimeline"></div>
      <div class="phase-detail" id="phaseDetail" hidden></div>
    </div>
    <div class="health-bar" id="healthBar" hidden></div>
    <div class="btools">
      <input type="search" id="fSearch" placeholder="Search tickets" aria-label="Search id, title, label, or assignee">
      <select id="fSprint" aria-label="Filter by sprint"></select>
      <select id="fState" aria-label="Filter by state"></select>
      <select id="fPriority" aria-label="Filter by priority">
        <option value="">All priorities</option>
        <option value="high">High priority</option>
        <option value="medium">Medium priority</option>
        <option value="low">Low priority</option>
        <option value="__none">No priority</option>
      </select>
      <select id="fTier" aria-label="Filter by model">
        <option value="">All models</option>
        <option value="dev-high">Claude · high-level dev</option>
        <option value="dev-medium">GPT · medium dev</option>
        <option value="dev-low">DeepSeek · low-level dev</option>
        <option value="art">Gemini / GPT · art</option>
        <option value="__none">Unrouted</option>
      </select>
    </div>
    <div class="status-tabs" id="statusTabs" aria-label="Board columns"></div>
    <div class="board" id="board"></div>
  </div>
</main>
<script>
const grid = document.getElementById("grid");
const msg = document.getElementById("msg");
const busy = new Set();
let latest = [];

function setMessage(text, ok) {
  msg.textContent = text || "";
  msg.className = ok ? "msg ok" : "msg";
}

async function api(method, url, body) {
  const response = await fetch(url, {
    method,
    headers: { "content-type": "application/json" },
    body: body ? JSON.stringify(body) : undefined,
  });
  const data = await response.json();
  if (!response.ok) throw new Error(data.error || response.statusText);
  return data;
}

function el(tag, props, children) {
  const node = document.createElement(tag);
  Object.assign(node, props || {});
  for (const child of children || []) node.append(child);
  return node;
}

const PROVIDER_ICONS = {
  claude: { label: "Claude", fallback: "C" },
  openai: { label: "OpenAI", fallback: "G" },
  gemini: { label: "Gemini", fallback: "Ge" },
  deepseek: { label: "DeepSeek", fallback: "D" },
};

const MODEL_INFO = {
  "dev-high": { cls: "claude", provider: "Claude", level: "High-level dev", icons: ["claude"] },
  "dev-medium": { cls: "gpt", provider: "GPT", level: "Medium dev", icons: ["openai"] },
  "dev-low": { cls: "deepseek", provider: "DeepSeek", level: "Low-level dev", icons: ["deepseek"] },
  art: { cls: "art", provider: "Gemini + GPT", level: "Art", icons: ["gemini", "openai"] },
};

function providerBadge(tier, compact) {
  const info = MODEL_INFO[tier];
  if (!info) {
    return el("span", { className: "provider-badge missing", title: "Select a model before work begins" }, [
      el("span", { className: "mark", textContent: "?", ariaHidden: "true" }),
      el("span", { className: "provider", textContent: "Unrouted" }),
    ]);
  }
  const icons = info.icons.map((name) => el("span", { className: `provider-icon ${name}`, textContent: PROVIDER_ICONS[name].fallback, title: PROVIDER_ICONS[name].label, ariaHidden: "true" }));
  const children = [el("span", { className: "marks" }, icons), el("span", { className: "provider", textContent: info.provider })];
  if (!compact) children.push(el("span", { className: "level", textContent: info.level }));
  return el("span", { className: `provider-badge ${info.cls}`, title: `${tier}: ${info.provider} — ${info.level}` }, children);
}

function renderModelRail() {
  document.getElementById("modelRail").replaceChildren(...Object.keys(MODEL_INFO).map((tier) => providerBadge(tier, false)));
}

const GATE_LABELS = { "not-started": "Not started", "in-progress": "In progress", "completed": "Completed", "approved": "Approved" };

function findPhaseSprint(project) {
  const sprints = (project.summary && project.summary.sprints) || [];
  return sprints.find((sprint) => sprint.title === project.currentPhase) || null;
}

function phaseSection(project) {
  if (!project.currentPhase || !project.phaseProgress) return null;
  const gate = project.gateStatus;
  const head = el("div", { className: "phase-head" }, [
    el("span", { className: "phase-name", textContent: project.currentPhase, title: project.currentPhase }),
    el("span", { className: `badge gate-${gate}`, textContent: GATE_LABELS[gate] || gate }),
  ]);
  const bar = el("div", { className: "phase-bar" }, [el("div", { className: "phase-fill", style: `width:${project.phaseProgress.percent}%` })]);
  const label = el("div", { className: "now", textContent: `${project.phaseProgress.done}/${project.phaseProgress.total} tickets done (${project.phaseProgress.percent}%)` });
  return el("div", { className: "phase" }, [head, bar, label]);
}

function columnChips(summary) {
  const wrap = el("div", { className: "cols" });
  const order = ["In Progress", "To Do", "Done", "Closed"];
  for (const status of order) {
    if (!Object.prototype.hasOwnProperty.call(summary.counts, status)) continue;
    const count = summary.counts[status];
    const kind = /progress/i.test(status) ? "prog" : /^(done|closed)$/i.test(status) ? "done" : "";
    wrap.append(el("span", { className: `col ${kind}` }, [el("b", { textContent: String(count) }), status]));
  }
  if (!summary.total) wrap.append(el("span", { className: "col", textContent: "No tasks" }));
  return wrap;
}

// One chip per protocol-health problem. Click handler is optional: the project card shows them
// read-only, the board makes them filter buttons (see renderHealthBar).
function healthChips(health, onPick, activeKey) {
  if (!health || !health.total) return null;
  const defs = [
    { key: "noTier", label: "no model tier", n: health.noTier + health.multiTier, ids: [...health.ids.noTier, ...health.ids.multiTier], cls: "bad" },
    { key: "doneNoAC", label: "Done without AC", n: health.ids.doneNoAC.length, ids: health.ids.doneNoAC, cls: "bad" },
    { key: "doneAcOpen", label: "Done, AC unchecked", n: health.ids.doneAcOpen.length, ids: health.ids.doneAcOpen, cls: "warn" },
    { key: "unassigned", label: "running, no owner", n: health.inProgressUnassigned, ids: health.ids.inProgressUnassigned, cls: "warn" },
    { key: "stale", label: `stale >${health.staleHours}h`, n: health.stale, ids: health.ids.stale, cls: "warn" },
    { key: "blocked", label: "blocked", n: health.blocked, ids: health.ids.blocked, cls: "" },
  ].filter((def) => def.n > 0);
  const wrap = el("div", { className: "hchips" });
  if (!defs.length) {
    wrap.append(el("span", { className: "hchip ok", textContent: "protocol OK" }));
    return wrap;
  }
  for (const def of defs) {
    const node = el(onPick ? "button" : "span", { className: `hchip ${def.cls}${activeKey === def.key ? " active" : ""}`, title: def.ids.join(", ") }, [el("b", { textContent: String(def.n) }), def.label]);
    if (onPick) { node.type = "button"; node.onclick = () => onPick(def); }
    wrap.append(node);
  }
  return wrap;
}

function healthIds(health, key) {
  if (!health) return [];
  if (key === "noTier") return [...health.ids.noTier, ...health.ids.multiTier];
  if (key === "unassigned") return health.ids.inProgressUnassigned;
  return health.ids[key] || [];
}

function renderHealthBar() {
  const bar = document.getElementById("healthBar");
  if (board.pendingHealth) {
    healthFilter.key = board.pendingHealth;
    healthFilter.ids = new Set(healthIds(board.data && board.data.health, board.pendingHealth));
    board.pendingHealth = "";
  }
  const chips = board.data && healthChips(board.data.health, (def) => {
    if (healthFilter.key === def.key) { healthFilter.key = ""; healthFilter.ids = null; }
    else { healthFilter.key = def.key; healthFilter.ids = new Set(def.ids); fState.value = ""; }
    renderBoard();
  }, healthFilter.key);
  if (!chips) { bar.hidden = true; bar.replaceChildren(); return; }
  const clear = el("button", { className: "hb-clear", type: "button", textContent: "Clear", hidden: !healthFilter.key });
  clear.onclick = () => { healthFilter.key = ""; healthFilter.ids = null; renderBoard(); };
  bar.replaceChildren(el("span", { className: "hb-title", textContent: "Protocol health" }), chips, clear);
  bar.hidden = false;
}

function inProgressList(summary) {
  if (!summary.inProgress.length) return null;
  const names = summary.inProgress.slice(0, 3).map((task) => `${task.id} ${task.title}`).join(" · ");
  const extra = summary.inProgress.length > 3 ? ` +${summary.inProgress.length - 3}` : "";
  return el("div", { className: "now", title: names }, [el("strong", { textContent: "Active: " }), `${names}${extra}`]);
}

async function act(id, label, run) {
  busy.add(id);
  setMessage("");
  render();
  try {
    await run();
    if (label) setMessage(label, true);
  } catch (error) {
    setMessage(error.message);
  } finally {
    busy.delete(id);
    await refresh();
  }
}

function initControls(project) {
  const prefix = el("input", { placeholder: "prefix (letters)", maxLength: 10, ariaLabel: "Task ID prefix" });
  prefix.value = project.name.replace(/[^a-z]/gi, "").slice(0, 4).toLowerCase();
  const button = el("button", { className: "primary", textContent: "Init Backlog", disabled: busy.has(project.id) });
  button.onclick = () => act(project.id, "Initialized", () => api("POST", `/api/projects/${project.id}/init`, { prefix: prefix.value }));
  return el("div", { className: "init" }, [prefix, button]);
}

function actionRow(project) {
  const row = el("div", { className: "actions" });
  const disabled = busy.has(project.id);
  if (project.initialized && project.exists) {
    const boardLink = el("button", { className: "board-open", textContent: "Open board", disabled });
    boardLink.onclick = () => { location.hash = `#board/${project.id}`; };
    row.append(boardLink);
    const phaseSprint = findPhaseSprint(project);
    if (phaseSprint) {
      const phaseLink = el("button", { className: "phase-open", textContent: "Phase", disabled, title: project.currentPhase });
      phaseLink.onclick = () => { location.hash = `#board/${project.id}/${encodeURIComponent(phaseSprint.id)}`; };
      row.append(phaseLink);
    }
    if (project.running) {
      row.append(el("a", { className: "open", href: project.url, target: "_blank", rel: "noopener", textContent: "Open dashboard" }));
      const stop = el("button", { textContent: "Stop", disabled });
      stop.onclick = () => act(project.id, "", () => api("POST", `/api/projects/${project.id}/stop`));
      row.append(stop);
    } else {
      const start = el("button", { className: "primary", textContent: "Start dashboard", disabled });
      start.onclick = () => act(project.id, "", () => api("POST", `/api/projects/${project.id}/start`));
      row.append(start);
    }
  } else if (project.exists) {
    row.append(initControls(project));
  }
  const remove = el("button", { className: "danger", textContent: "Remove", disabled });
  remove.onclick = () => {
    if (confirm(`Remove "${project.name}" from AI Hub? Files in the repo are kept.`)) {
      act(project.id, "Removed", () => api("DELETE", `/api/projects/${project.id}`));
    }
  };
  row.append(remove);
  return row;
}

function statusBadge(project) {
  if (!project.exists) return el("span", { className: "badge bad", textContent: "Missing" });
  if (!project.initialized) return el("span", { className: "badge", textContent: "Not initialized" });
  return el("span", { className: project.running ? "badge on" : "badge", textContent: project.running ? `Running :${project.port}` : "Stopped" });
}

function sprintSection(project) {
  const summary = project.summary;
  const count = (summary.sprints || []).filter((sprint) => !sprint.completed).length;
  const drawer = el("details", { className: "drawer" }, [el("summary", { textContent: `${count} active sprint${count === 1 ? "" : "s"}` })]);
  const body = el("div", { className: "drawer-body" });
  if (summary.sprintsError) body.append(el("div", { className: "err", textContent: summary.sprintsError }));
  for (const sprint of summary.sprints || []) {
    const meta = `${sprint.done}/${sprint.total}${sprint.due ? ` · ${sprint.due}` : ""}`;
    body.append(el("div", { className: `sprint ${sprint.completed ? "completed" : ""}` }, [
      el("span", { textContent: sprint.title, title: sprint.title }),
      el("span", { textContent: sprint.completed ? `${meta} · done` : meta }),
    ]));
  }
  const name = el("input", { type: "text", placeholder: "Sprint name", maxLength: 80, ariaLabel: "Sprint name", required: true });
  const due = el("input", { type: "date", ariaLabel: "Sprint due date" });
  const add = el("button", { type: "submit", textContent: "Add", disabled: busy.has(project.id) });
  const form = el("form", { className: "sprintform" }, [name, due, add]);
  form.onsubmit = (event) => {
    event.preventDefault();
    act(project.id, "Sprint added", () => api("POST", `/api/projects/${project.id}/sprints`, { name: name.value, dueDate: due.value }));
  };
  body.append(form);
  drawer.append(body);
  return drawer;
}

function unplannedSection(project) {
  const summary = project.summary;
  const open = (summary.sprints || []).filter((sprint) => !sprint.completed);
  if (!summary.unplannedTotal || !open.length) return null;
  const drawer = el("details", { className: "drawer" }, [el("summary", { textContent: `${summary.unplannedTotal} not in a sprint` })]);
  const body = el("div", { className: "drawer-body" });
  for (const task of summary.unplanned) {
    const select = el("select", { ariaLabel: `Assign ${task.id} to a sprint`, disabled: busy.has(project.id) });
    select.append(el("option", { value: "", textContent: "Choose sprint" }));
    for (const sprint of open) select.append(el("option", { value: sprint.id, textContent: sprint.title }));
    select.onchange = () => {
      if (select.value) act(project.id, `${task.id} assigned`, () => api("POST", `/api/projects/${project.id}/assign`, { taskId: task.id, sprintId: select.value }));
    };
    body.append(el("div", { className: "utask" }, [el("span", { textContent: `${task.id} ${task.title}`, title: task.title }), select]));
  }
  if (summary.unplannedTotal > summary.unplanned.length) body.append(el("div", { className: "sub", textContent: `+${summary.unplannedTotal - summary.unplanned.length} more` }));
  drawer.append(body);
  return drawer;
}

function protocolNotice(project) {
  if (!project.protocolStale) return null;
  const button = el("button", { textContent: "Update", disabled: busy.has(project.id) });
  button.onclick = () => act(project.id, "Agent protocol updated", () => api("POST", `/api/projects/${project.id}/protocol`));
  return el("div", { className: "notice" }, [el("span", { textContent: "Model-routing instructions need an update" }), button]);
}

function openHealthBoard(projectId, key) {
  board.pendingHealth = key;
  const target = `#board/${projectId}`;
  if (location.hash === target && board.id === projectId && board.data) renderBoard();
  else location.hash = target;
}

function card(project) {
  const node = el("article", { className: `card ${project.exists ? "" : "missing"}` });
  const identity = el("div", { className: "identity" }, [
    el("div", { className: "identity-row" }, [el("div", { className: "title", textContent: project.name }), statusBadge(project)]),
    el("div", { className: "path", textContent: project.path, title: project.path }),
  ]);
  const activity = el("div", { className: "activity" });
  if (project.summary && project.summary.error) activity.append(el("div", { className: "err", textContent: project.summary.error }));
  else if (project.summary) {
    const phase = phaseSection(project);
    if (phase) activity.append(phase);
    activity.append(columnChips(project.summary));
    const now = inProgressList(project.summary);
    if (now) activity.append(now);
    const chips = healthChips(project.summary.health, (def) => openHealthBoard(project.id, def.key));
    if (chips) activity.append(chips);
  }
  node.append(el("div", { className: "card-main" }, [identity, activity, actionRow(project)]));
  if (project.summary && !project.summary.error) {
    const detail = el("div", { className: "card-detail" }, [sprintSection(project)]);
    const unplanned = unplannedSection(project);
    if (unplanned) detail.append(unplanned);
    node.append(detail);
    const notice = protocolNotice(project);
    if (notice) node.append(notice);
  }
  return node;
}

function render() {
  grid.replaceChildren();
  if (!latest.length) {
    grid.append(el("div", { className: "empty", textContent: "No projects yet. Add a repo path above." }));
    return;
  }
  for (const project of latest) grid.append(card(project));
}

async function refresh() {
  try {
    latest = (await api("GET", "/api/projects")).projects;
    render();
  } catch (error) {
    setMessage(error.message);
  }
}

const picker = {
  dlg: document.getElementById("picker"),
  list: document.getElementById("pkList"),
  crumbs: document.getElementById("pkCrumbs"),
  path: document.getElementById("pkPath"),
  sel: document.getElementById("pkSel"),
  name: document.getElementById("pkName"),
  err: document.getElementById("pkErr"),
  add: document.getElementById("pkAdd"),
  state: null,
  chosen: "",
  busy: false,
};

function pickerError(text) { picker.err.textContent = text || ""; }

function pickerSelect(dir) {
  picker.chosen = dir ? dir.path : "";
  picker.sel.replaceChildren();
  if (dir) {
    picker.sel.append("Add: ", el("b", { textContent: dir.path }));
    picker.sel.title = dir.path;
  }
  picker.add.disabled = !dir || dir.added;
  if (dir && dir.added) pickerError("This folder is already added.");
  else pickerError("");
  for (const row of picker.list.querySelectorAll(".pk-row")) row.classList.toggle("selected", row.dataset.path === picker.chosen);
}

function pickerCrumbs(dirPath) {
  const parts = dirPath.split("/").filter(Boolean);
  const nodes = [el("button", { type: "button", textContent: "/", onclick: () => pickerLoad("/") })];
  let acc = "";
  for (const part of parts) {
    acc += `/${part}`;
    const target = acc;
    nodes.push(el("span", { textContent: "›" }), el("button", { type: "button", textContent: part, onclick: () => pickerLoad(target) }));
  }
  picker.crumbs.replaceChildren(...nodes);
  picker.crumbs.scrollLeft = picker.crumbs.scrollWidth;
}

async function pickerLoad(dirPath) {
  pickerError("");
  try {
    const data = await api("GET", `/api/fs?path=${encodeURIComponent(dirPath || "")}`);
    picker.state = data;
    picker.path.value = data.path;
    pickerCrumbs(data.path);
    document.getElementById("pkUp").disabled = !data.parent;
    const rows = data.directories.map((dir) => {
      const tags = [];
      if (dir.initialized) tags.push(el("span", { className: "pk-tag bl", textContent: "backlog" }));
      else if (dir.isGit) tags.push(el("span", { className: "pk-tag git", textContent: "git" }));
      if (dir.added) tags.push(el("span", { className: "pk-tag added", textContent: "added" }));
      const row = el("button", { type: "button", className: `pk-row${dir.added ? " disabled" : ""}`, role: "option", title: dir.path }, [
        el("span", { textContent: "📁" }),
        el("span", { className: "pk-name", textContent: dir.name }),
        ...tags,
      ]);
      row.dataset.path = dir.path;
      row.onclick = () => pickerSelect(dir);
      row.ondblclick = () => pickerLoad(dir.path);
      row.onkeydown = (event) => { if (event.key === "ArrowRight") pickerLoad(dir.path); };
      return row;
    });
    picker.list.replaceChildren(...(rows.length ? rows : [el("div", { className: "pk-empty", textContent: "No sub-folders here. You can still add this folder." })]));
    // Default selection = the folder being viewed, so "Add this folder" works without extra clicks.
    pickerSelect({ path: data.path, added: data.added });
    picker.list.scrollTop = 0;
  } catch (error) {
    pickerError(error.message);
  }
}

function pickerOpen() {
  pickerError("");
  picker.name.value = "";
  if (typeof picker.dlg.showModal === "function") picker.dlg.showModal();
  else picker.dlg.setAttribute("open", "");
  pickerLoad(picker.state ? picker.state.path : "");
}

function pickerClose() {
  if (picker.dlg.open) picker.dlg.close();
}

document.getElementById("addOpen").onclick = pickerOpen;
document.getElementById("pkClose").onclick = pickerClose;
document.getElementById("pkCancel").onclick = pickerClose;
document.getElementById("pkUp").onclick = () => { if (picker.state && picker.state.parent) pickerLoad(picker.state.parent); };
document.getElementById("pkHome").onclick = () => pickerLoad(picker.state ? picker.state.home : "");
picker.path.onkeydown = (event) => { if (event.key === "Enter") { event.preventDefault(); pickerLoad(picker.path.value); } };
picker.dlg.addEventListener("click", (event) => { if (event.target === picker.dlg) pickerClose(); });

document.getElementById("pkForm").onsubmit = async (event) => {
  event.preventDefault();
  if (picker.busy || !picker.chosen) return;
  picker.busy = true;
  picker.add.disabled = true;
  pickerError("");
  try {
    const result = await api("POST", "/api/projects", { path: picker.chosen, name: picker.name.value });
    pickerClose();
    setMessage(`Added ${result.project.name}`, true);
    await refresh();
  } catch (error) {
    pickerError(error.message);
    picker.add.disabled = false;
  } finally {
    picker.busy = false;
  }
};

const addForm = document.getElementById("addForm");
const modelRail = document.getElementById("modelRail");
const boardView = document.getElementById("boardView");
const boardEl = document.getElementById("board");
const statusTabs = document.getElementById("statusTabs");
const mainEl = document.getElementById("main");
const fSearch = document.getElementById("fSearch");
const fSprint = document.getElementById("fSprint");
const fPriority = document.getElementById("fPriority");
const fTier = document.getElementById("fTier");
const fState = document.getElementById("fState");
const phaseMetricsEl = document.getElementById("phaseMetrics");
const board = { id: null, data: null, metrics: null, limits: {}, dragging: false, busy: false, draft: "", draftTier: "dev-high", sprintSig: "", mobileStatus: "", pendingSprint: null, pendingHealth: "", openGroups: new Set() };
const FINISHED = /^(done|closed)$/i;
const FIRST_PAGE = 40;
const FINISHED_PAGE = 15;

const healthFilter = { key: "", ids: null };

function visibleTasks() {
  const q = fSearch.value.trim().toLowerCase();
  return board.data.tasks.filter((task) => {
    if (healthFilter.ids) { if (!healthFilter.ids.has(task.id)) return false; }
    if (fState.value === "__open") { if (FINISHED.test(task.status)) return false; }
    else if (fState.value === "__ready") { if (!/^to do$/i.test(task.status) || !task.isReady || task.assignees.length) return false; }
    else if (fState.value === "__blocked") { if (FINISHED.test(task.status) || task.isReady) return false; }
    else if (fState.value === "__stale") { if (!task.stale) return false; }
    else if (fState.value && task.status.toLowerCase() !== fState.value.toLowerCase()) return false;
    if (fSprint.value === "__none") { if (task.milestone) return false; }
    else if (fSprint.value && task.milestone !== fSprint.value) return false;
    if (fPriority.value === "__none") { if (task.priority) return false; }
    else if (fPriority.value && (task.priority || "").toLowerCase() !== fPriority.value) return false;
    if (fTier.value === "__none") { if (task.modelTier) return false; }
    else if (fTier.value && task.modelTier !== fTier.value) return false;
    if (q && !`${task.id} ${task.title} ${task.labels.join(" ")} ${task.assignees.join(" ")}`.toLowerCase().includes(q)) return false;
    return true;
  });
}

function syncToolbar() {
  const sprints = board.data.sprints;
  const sig = JSON.stringify([sprints.map((sprint) => [sprint.id, sprint.title]), board.data.statuses]);
  if (sig === board.sprintSig) return;
  board.sprintSig = sig;
  const previous = fSprint.value;
  fSprint.replaceChildren(
    el("option", { value: "", textContent: "All sprints" }),
    el("option", { value: "__none", textContent: "No sprint" }),
    ...sprints.map((sprint) => el("option", { value: sprint.id, textContent: sprint.completed ? `${sprint.title} (completed)` : sprint.title })),
  );
  const pending = board.pendingSprint;
  board.pendingSprint = null;
  const options = [...fSprint.options].map((option) => option.value);
  if (pending && options.includes(pending)) fSprint.value = pending;
  else fSprint.value = options.includes(previous) ? previous : "";
  const previousState = fState.value;
  fState.replaceChildren(
    el("option", { value: "", textContent: "All states" }),
    el("option", { value: "__open", textContent: "Not finished" }),
    el("option", { value: "__ready", textContent: "Ready to claim" }),
    el("option", { value: "__blocked", textContent: "Blocked" }),
    el("option", { value: "__stale", textContent: "Stale (no update)" }),
    ...board.data.statuses.map((status) => el("option", { value: status, textContent: status })),
  );
  fState.value = [...fState.options].some((option) => option.value === previousState) ? previousState : "";
}

async function moveTicket(taskId, status) {
  const task = board.data.tasks.find((entry) => entry.id === taskId);
  if (!task || task.status.toLowerCase() === status.toLowerCase()) return;
  const previous = task.status;
  task.status = status;
  board.busy = true;
  setMessage("");
  renderBoard();
  try {
    await api("POST", `/api/projects/${board.id}/move`, { taskId, status });
    setMessage(`${taskId} moved to ${status}`, true);
  } catch (error) {
    task.status = previous;
    setMessage(error.message);
  } finally {
    board.busy = false;
    await loadBoardData();
  }
}

async function changeTier(taskId, modelTier) {
  const task = board.data.tasks.find((entry) => entry.id === taskId);
  if (!task || task.modelTier === modelTier) return;
  const previous = task.modelTier;
  task.modelTier = modelTier;
  renderBoard();
  try {
    await api("POST", `/api/projects/${board.id}/tier`, { taskId, modelTier });
    setMessage(`${taskId} routed to ${modelTier}`, true);
  } catch (error) {
    task.modelTier = previous;
    setMessage(error.message);
  }
  await loadBoardData();
}

const PHASE_HUES = 8;
function phaseClass(title) {
  const match = /^Phase\s*(\d+)/i.exec(title || "");
  return match ? ` ph ph-${Number(match[1]) % PHASE_HUES}` : "";
}

function ageText(value) {
  const ms = Date.now() - new Date(value).getTime();
  if (!Number.isFinite(ms) || ms < 0) return "";
  const hours = Math.floor(ms / 3600000);
  return hours >= 48 ? `${Math.floor(hours / 24)}d` : `${hours}h`;
}

function ticket(task, statuses, sprintTitles) {
  const priority = (task.priority || "").toLowerCase();
  const phaseCls = task.milestone && sprintTitles.has(task.milestone) ? phaseClass(sprintTitles.get(task.milestone)) : "";
  const flagCls = `${task.stale ? " stale" : ""}${!task.isReady && !FINISHED.test(task.status) ? " blocked" : ""}`;
  const node = el("article", { className: `ticket ${priority ? `p-${priority}` : ""}${phaseCls}${flagCls}`, draggable: true });
  node.dataset.id = task.id;
  node.ondragstart = (event) => {
    board.dragging = true;
    event.dataTransfer.setData("text/plain", task.id);
    event.dataTransfer.effectAllowed = "move";
    node.classList.add("dragging");
  };
  node.ondragend = () => { board.dragging = false; node.classList.remove("dragging"); };
  node.append(el("div", { className: "ticket-head" }, [
    el("span", { className: "tid", textContent: task.id }),
    providerBadge(task.modelTier, true),
  ]));
  node.append(el("div", { className: "tt", textContent: task.title, title: task.title }));
  const meta = el("div", { className: "tmeta" });
  if (task.milestone && sprintTitles.has(task.milestone)) {
    const sprintTitle = sprintTitles.get(task.milestone);
    meta.append(el("span", { className: phaseClass(sprintTitle).trim(), textContent: sprintTitle, title: "Phase / sprint" }));
  }
  if (task.priority) meta.append(el("span", { className: `pri pri-${priority}`, textContent: task.priority }));
  if (task.stale) meta.append(el("span", { className: "flag stale", textContent: `stale ${ageText(task.updatedAt)}`.trim(), title: `In Progress, no update for over ${board.data.health ? board.data.health.staleHours : 24}h` }));
  if (!task.isReady && !FINISHED.test(task.status)) {
    const blockers = task.blockedBy || [];
    const text = blockers.length ? `blocked by ${blockers.join(", ")}` : "blocked";
    const flag = el("button", { className: "flag blocked", type: "button", textContent: text, title: task.blockedError || "A dependency is not Done yet" });
    flag.onclick = () => { if (blockers[0]) focusTicket(blockers[0]); };
    meta.append(flag);
  }
  else if (/^to do$/i.test(task.status) && !task.assignees.length) meta.append(el("span", { className: "flag ready", textContent: "ready", title: "Dependencies done, nobody has claimed it" }));
  if (task.dueDate) {
    const late = !FINISHED.test(task.status) && task.dueDate < new Date().toISOString().slice(0, 10);
    meta.append(el("span", { className: late ? "due late" : "due", textContent: `due ${task.dueDate}` }));
  }
  const ordinaryLabels = task.labels.filter((label) => !board.data.modelTiers.includes(label));
  for (const label of ordinaryLabels.slice(0, 2)) meta.append(el("span", { textContent: label }));
  if (ordinaryLabels.length > 2) meta.append(el("span", { textContent: `+${ordinaryLabels.length - 2}` }));
  if (task.assignees.length) meta.append(el("span", { textContent: task.assignees[0], title: task.assignees.join(", ") }));
  if (meta.childNodes.length) node.append(meta);
  const move = el("select", { ariaLabel: `Move ${task.id}` });
  move.append(el("option", { value: "", textContent: "Move" }));
  for (const status of statuses) if (status.toLowerCase() !== task.status.toLowerCase()) move.append(el("option", { value: status, textContent: status }));
  move.onchange = () => { if (move.value) moveTicket(task.id, move.value); };
  const tier = el("select", { ariaLabel: `Route ${task.id}` });
  tier.append(el("option", { value: "", textContent: "Route" }));
  for (const modelTier of board.data.modelTiers) tier.append(el("option", { value: modelTier, textContent: MODEL_INFO[modelTier].provider }));
  tier.value = task.modelTier || "";
  tier.onchange = () => { if (tier.value) changeTier(task.id, tier.value); };
  node.append(el("div", { className: "ticket-actions" }, [move, tier]));
  return node;
}

function quickAdd() {
  const input = el("input", { type: "text", placeholder: "New ticket title", maxLength: 200, ariaLabel: "New ticket title", required: true });
  input.value = board.draft;
  input.oninput = () => { board.draft = input.value; };

      await api("POST", `/api/projects/${board.id}/tasks`, { title: input.value, sprintId, modelTier: tier.value });

      await loadBoardData();
    } catch (error) {

      add.disabled = false;
    }
